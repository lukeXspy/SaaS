name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy — Prisma generate não conecta, apenas lê o schema
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      AUTH_SECRET: "ci-only-dummy-secret-not-used-in-production"
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_STORAGE_BUCKET: "manutenza-media"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: node node_modules/prisma/build/index.js generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Next.js build
        run: npm run build

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high || echo "::warning::Vulnerabilidades de alta severidade encontradas — revisar"
        continue-on-error: true